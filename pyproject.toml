[project]
name = "enterprise-ai-hub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mr-mohitrawat", email = "mohitrawat.prof@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.151.0",
    "google-adk>=2.13.0",
    "litellm>=1.106.2",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
